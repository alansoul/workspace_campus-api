name: 🐛 Bug Report
description: Report a reproducible problem in campus-api
title: '[BUG]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: 'Thanks for reporting. Please fill out the required sections for campus-api.'

  - type: input
    id: module
    attributes:
      label: Which module / service?
      placeholder: 'e.g. IAM, University, Freelance, Chat Gateway'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Paste terminal output or NestJS logs here.
      render: shell