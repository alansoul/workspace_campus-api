version: 2
updates:
  # NPM packages (weekly)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Kolkata'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'type: dependencies'
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      prisma:
        patterns:
          - '@prisma/*'
          - 'prisma'

  # GitHub Actions (monthly)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'type: dependencies'
      - 'domain: infra'