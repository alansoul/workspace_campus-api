name: 'Setup Workspace'
description: 'Sets up Node.js 22, pnpm v12, and caches dependencies.'
runs:
  using: 'composite'
  steps:
    - name: ⚙️ Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: 📦 Install Dependencies
      shell: bash
      run: |
        pnpm install --no-frozen-lockfile
        pnpm add -w -D @rolldown/binding-linux-x64-gnu @oxlint/binding-linux-x64-gnu