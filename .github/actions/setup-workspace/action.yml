name: 'Setup Workspace'
description: 'Sets up Node.js, pnpm v12, and installs dependencies.'
runs:
  using: 'composite'
  steps:
    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: ⚙️ Install pnpm v12
      shell: bash
      run: npm install -g pnpm@12.4.1

    - name: 📦 Install Dependencies
      shell: bash
      run: |
        pnpm install --no-frozen-lockfile
        pnpm add -w -D @oxlint/binding-linux-x64-gnu @rolldown/binding-linux-x64-gnu || true